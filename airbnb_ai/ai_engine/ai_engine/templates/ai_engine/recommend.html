<!DOCTYPE html>
<html>
<head>
    <title>Smart Property Recommendation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">Find Your Perfect Stay</h2>

    <form method="GET" action="{% url 'recommend-page' %}" class="row g-3">

        <div class="col-md-4">
            <input type="number" name="budget" class="form-control" placeholder="Max Budget (₹)">
        </div>

        <div class="col-md-4">
            <input type="text" name="location" class="form-control" placeholder="Location">
        </div>

        <div class="col-md-4">
            <input type="number" name="guests" class="form-control" placeholder="Guests">
        </div>

        <div class="col-12 text-center">
            <button type="submit" class="btn btn-primary px-5">Search</button>
        </div>
    </form>

    <hr class="my-5">

    <div class="row">
        {% for property in properties %}
        <div class="col-md-4 mb-4">
            <div class="card bg-secondary text-light">
                {% if property.image %}
                <img src="{{ property.image.url }}" class="card-img-top" height="200">
                {% endif %}
                <div class="card-body">
                    <h5 class="card-title">{{ property.title }}</h5>
                    <p>📍 {{ property.location }}</p>
                    <p>💰 ₹{{ property.price_per_night }} / night</p>
                    <p>⭐ {{ property.average_rating }}</p>
                </div>
            </div>
        </div>
        {% empty %}
        <p class="text-center">No properties found.</p>
        {% endfor %}
    </div>
    
</div>

</body>
</html>
